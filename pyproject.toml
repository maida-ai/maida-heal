[project]
name = "maida-heal"
dynamic = ["version"]
description = "Experimental self-healing loop verified by Maida."
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Maida.AI" },
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "maida-ai>=0.6.0",
  "pydantic>=2.12.0,<3.0.0",
  "pyyaml>=6.0.3,<6.1.0",
  "typer>=0.27.0,<0.28.0",
]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/maida-ai/maida-heal"

[project.scripts]
maida-heal = "maida.heal.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.26.0,<5.0.0",
  "mypy>=1.19.1,<2.0.0",
  "pytest>=9.0.2,<10.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "pytest-randomly>=4.1.0",  # Random test order
  "pytest-xdist>=3.8.0",     # Parallel tests
  "ruff>=0.16.0,<0.17.0",
]

[build-system]
requires = ["hatchling>=1.28.0,<1.29.0", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

# Install only maida/heal — do not ship maida/__init__.py.
# Core maida-ai owns maida/__init__.py (with pkgutil.extend_path).
[tool.hatch.build.targets.wheel]
only-include = ["maida/heal"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
pattern = "default-unprefixed"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.version]
path = "maida/heal/_version.py"
template = '''
# This file is managed by dynamic versioning. Do not edit manually.
version = "{version}"
'''

[tool.coverage.run]
branch = true
source = ["maida.heal"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema"
ignore_missing_imports = true
